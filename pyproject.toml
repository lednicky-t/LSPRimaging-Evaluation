[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lspr-imaging-evaluation"
description = "LSPR imaging offline evaluation application."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
# Version bounds follow the pinning policy in CLAUDE.md ("Dependency Pinning"):
# floor = currently tested version, ceiling = next breaking-change boundary.
# imagecodecs and tifffile use calendar versioning (YYYY.M.D), so their
# ceiling is "next year" rather than "next major". ome-zarr, numcodecs,
# scikit-image, and pyqtgraph are pre-1.0 (API can break on any minor
# release), hence their tight "<0.N+1"/"<0.15" ceilings instead of "<1".
dependencies = [
    "h5py>=3.16,<4",
    "numpy>=2.4,<3",
    "pydantic>=2,<3",
    "Pillow>=12.2,<13",
    "PyQt6>=6.11,<7",
    # PyQt6-sip is normally just a transitive dependency of PyQt6, but 13.11.1
    # on Python 3.14 has a reproducible access-violation crash (0xC0000005,
    # inside sip.pyd itself) when closing the main window after a dataset is
    # loaded - fixed in 13.12.0. Pinned explicitly so a fresh install doesn't
    # silently resolve back to a known-bad version.
    "PyQt6-sip>=13.12.0",
    "imagecodecs>=2026.6.6,<2027",
    "ome-zarr>=0.17,<0.18",
    "numcodecs>=0.16,<0.17",
    # CRC32C of a zarr v3 shard's index (io/_zarr_export_worker.py `_crc32c`, checked on every read of an OME-Zarr plane). Soft-imported:
    # without it the check is a pure-Python loop, ~110-180 ms per 186 KB index (once per cube) = more than half of the read time of an analysis
    # scan of an OME-Zarr export; with it 27 us and the identical checksum (checked against the stored one of the test export, 2026-10-27).
    "crc32c>=2.9,<3",
    "pyqtgraph>=0.14,<0.15",
    "scikit-image>=0.26,<0.27",
    "scipy>=1.17,<2",
    "opencv-python-headless>=5.0,<6",
    "tifffile>=2026.5.15,<2027",
    "lucide>=1.1,<2",
    # Soft-imported where it is used (a missing psutil only switches that
    # feature off, mirroring the tifffile/zarrs optional-import pattern below),
    # but still declared here per this repo's pinning policy: every dependency
    # gets a floor+ceiling even when the code tolerates its absence. Rewrite:
    # analysis/scan.py - the scan's worker processes end by themselves when the
    # application is gone (a pool kept warm between scans would otherwise stay
    # as idle processes); without psutil there is no such watch. Old app: a
    # CPU-frequency debug line in gui/analysis_tasks.py.
    "psutil>=7.2,<8",
    # Resolves the shared per-user suite config directory for the rewrite's
    # app-level settings file (storage/app_settings.py) - same convention
    # `lspr_acq_shell.user_profile` already uses for lspr_settings.json/
    # lspr_users.json, and the same pin sLSPR acq already carries.
    "platformdirs>=4.10,<5",
    "lspr-ui>=0.1.0",
    "lspr-core>=0.1.0",
    "lspr-io>=0.1.0",
    # zarr>=3.3 specifically (not just >=3.2): 3.2.x's local-store sharding
    # partial-read path issues one file-open + thread-pool round-trip per
    # logical chunk touched even within an already-open shard, adding ~1.5ms
    # of pure dispatch overhead per chunk (measured via cProfile) regardless
    # of chunk size - a scoped ROI read spanning ~100 chunks cost ~150ms on
    # 3.2.1 vs ~37ms on 3.3.0 for the exact same file. Fixed upstream by
    # zarr-python PR #3004 ("Optimize partial shard reads"), released in 3.3.0.
    "zarr>=3.3,<4",
    # Rust-backed codec pipeline (see dataset/io.py's _configure_zarr_codec_pipeline).
    # Even with the 3.3.0 fix above, decoding the fetched chunks still happens
    # one-at-a-time by default (codec_pipeline.batch_size=1) - each dispatched
    # through its own asyncio task/thread-pool round trip regardless of chunk
    # size. zarrs replaces that per-chunk Python dispatch with a Rust loop:
    # measured on a real 66-ROI dataset, a 27-wavelength/cube ROI-scoped read
    # dropped from ~1000ms to ~195ms (~5x), full-plane reads from ~175ms to
    # ~23ms (~7.5x) - verified byte-identical output against the default
    # pipeline. Pre-1.0, so ceiling is next minor per the pinning policy above.
    #
    # ACTIVE: _configure_zarr_codec_pipeline switches zarr to it when the first
    # OME-Zarr is opened (an import failure falls back to zarr's own pipeline).
    # It was switched off on 2026-09-07 after a Windows STATUS_HEAP_CORRUPTION
    # crash and re-enabled on 2026-09-08, once the crash was traced to
    # QThreadPool workers touching zarr, not to zarrs: see the docstring there
    # and apps/LSPRi/eva/docs/qthreadpool_zarr_crash_investigation.md.
    "zarrs>=0.2.3,<0.3",
]

[project.scripts]
lspri-evaluation = "lspr_imaging_app.app:main"
# Rewrite-preview build (rewrite branch only, not the real app - see app_rewrite.py's docstring).
lspri-evaluation-rewrite = "lspr_imaging_app.app_rewrite:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lspr_imaging_app.version.APP_VERSION"}

[tool.ruff]
target-version = "py312"
src = ["src"]
